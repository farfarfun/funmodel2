[project]
name = "funmodel2"
version = "0.1.1"
description = "funmodel2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "farlog>=1.1.7",
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
yolo = ["funkeras>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funmodel2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
